<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{$_G['setting']['bbname']} - 登录</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            color: #1f2328;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            padding: 32px;
            box-sizing: border-box;
            text-align: center;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 8px;
        }

        .sub {
            margin: 0 0 24px;
            color: #667085;
            font-size: 14px;
        }

        .btns {
            display: grid;
            gap: 12px;
        }

        .btn {
            display: block;
            text-decoration: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
        }

        .btn-outline {
            border: 1px solid #d0d7de;
            color: #1f2328;
            background: #fff;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #98a2b3;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <h1 class="title">欢迎来到 {$_G['setting']['bbname']}</h1>
            <p class="sub">请先登录或注册后再访问站内内容</p>
            <div class="btns">
                <a class="btn btn-primary" href="{$loginurl}">登录</a>
                <a class="btn btn-outline" href="{$registerurl}">注册</a>
            </div>
            <div class="footer">登录后将自动跳回之前页面</div>
        </div>
    </div>
</body>

</html>
